name: Bug report
description: Something in the app is broken or behaves unexpectedly
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        If the solver gives a numerically wrong answer, please use the **Wrong result** template instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Open the example "..." (3D model or plane frame?)
        2. Click on "..."
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: share-url
    attributes:
      label: Share URL of the model
      description: Use the share button in the app and paste the link here, if the bug depends on a model.
      placeholder: https://wrucebayne29.github.io/frameforge/...
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and device
      placeholder: Windows 11 laptop, Android phone, ...
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots and console errors
      description: Drag in screenshots, and paste any errors from the browser console.
    validations:
      required: false
